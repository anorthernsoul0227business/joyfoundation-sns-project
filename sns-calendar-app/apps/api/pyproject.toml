[tool.poetry]
name = "sns-calendar-api"
version = "0.1.0"
description = "FastAPI scaffold for WEB-001"
authors = ["Joy Foundation"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
pydantic = {extras = ["email"], version = "^2.9.0"}
pydantic-settings = "^2.2.1"
pyjwt = "^2.9.0"
supabase = "^2.7.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"
pytest = "^8.2.0"
ruff = "^0.6.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/generate_openapi.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
  "E501",  # handled by formatter
  "B008",  # FastAPI Depends() defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "UP017"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
