name: E2E

on:
  pull_request:
    paths:
      - "sns-calendar-app/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E (opt-in)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.event_name == 'workflow_dispatch'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: sns-calendar-app

    env:
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_REUSE_SERVER: "0"
      E2E_FULL_STACK: "1"
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      X_CONSUMER_KEY: dummy-x-key
      X_CONSUMER_SECRET: dummy-x-secret
      META_APP_ID: dummy-meta-id
      META_APP_SECRET: dummy-meta-secret
      OAUTH_REDIRECT_BASE: http://localhost:8000
      SMTP_HOST: ""
      SMTP_FROM_ADDRESS: ""
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_PUBLIC_URL: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sns-calendar-app/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.3.4"

      - name: Install backend dependencies
        working-directory: sns-calendar-app/apps/api
        run: poetry install --no-interaction --no-root

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: sns-calendar-app/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate OpenAPI client
        run: pnpm --filter @sns-calendar/web generate:api-client

      - name: Build Next.js
        run: pnpm --filter @sns-calendar/web build

      - name: Start FastAPI (uvicorn)
        working-directory: sns-calendar-app/apps/api
        run: |
          nohup poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Start Celery worker
        working-directory: sns-calendar-app/apps/api
        run: |
          nohup poetry run celery -A app.tasks.celery_app worker --loglevel=info \
            > /tmp/celery-worker.log 2>&1 &
          echo $! > /tmp/celery-worker.pid

      - name: Start Celery beat
        working-directory: sns-calendar-app/apps/api
        run: |
          nohup poetry run celery -A app.tasks.celery_app beat --loglevel=info \
            > /tmp/celery-beat.log 2>&1 &
          echo $! > /tmp/celery-beat.pid

      - name: Start Next.js dev server
        working-directory: sns-calendar-app/apps/web
        run: |
          nohup pnpm dev > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:3000 && break
            sleep 2
          done

      - name: Run Playwright
        working-directory: sns-calendar-app/apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sns-calendar-app/apps/web/playwright-report
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: sns-calendar-app/apps/web/test-results
          retention-days: 14

      - name: Upload service logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/uvicorn.log
            /tmp/celery-worker.log
            /tmp/celery-beat.log
            /tmp/next.log
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          for f in /tmp/uvicorn.pid /tmp/celery-worker.pid /tmp/celery-beat.pid /tmp/next.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" || true
          done
