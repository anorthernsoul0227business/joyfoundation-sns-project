name: CI

on:
  pull_request:
    paths:
      - "sns-calendar-app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "sns-calendar-app/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / build / lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sns-calendar-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sns-calendar-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI client (stub schema)
        run: pnpm --filter @sns-calendar/web generate:api-client

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Security audit (axios supply-chain)
        run: |
          set -euo pipefail
          BAD_VERSIONS=("'axios@1.14.1'" "'axios@0.30.4'" "'plain-crypto-js@4.2.0'" "'plain-crypto-js@4.2.1'")
          FOUND=0
          for v in "${BAD_VERSIONS[@]}"; do
            if grep -q "${v}" pnpm-lock.yaml; then
              echo "::error::Supply chain attack package detected in pnpm-lock.yaml: ${v}"
              FOUND=1
            fi
          done
          exit $FOUND

  backend:
    name: Backend (pytest / ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sns-calendar-app/apps/api
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ci-dummy-anon
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.3.4"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('sns-calendar-app/apps/api/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Pytest
        run: poetry run pytest --maxfail=1

  openapi-schema-sync:
    name: OpenAPI schema committed?
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: sns-calendar-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sns-calendar-app/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.3.4"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: sns-calendar-app/apps/api
        run: poetry install --no-interaction --no-root

      - name: Regenerate OpenAPI schema
        run: pnpm openapi:gen-schema

      - name: Verify committed schema matches generated output
        run: git diff --exit-code -- apps/api/openapi.json
