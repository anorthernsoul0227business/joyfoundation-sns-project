name: SNS Auto Poster

on:
  schedule:
    # NOTE:
    # - GitHub ActionsのscheduleはUTC基準・ベストエフォート実行
    # - 毎時00分付近は高負荷で遅延/ドロップが起きやすいため、00分を避けて5分おきに実行
    - cron: '2-59/5 * * * *'  # 毎時02,07,12,...,57分(UTC)に実行
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no posting / no sheet update)'
        required: true
        default: true
        type: boolean
      platform:
        description: 'Target platform'
        required: true
        default: all
        type: choice
        options:
          - all
          - x
          - ig

env:
  TZ: Asia/Tokyo

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sns-auto-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Show trigger diagnostics
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
          echo "sha=${{ github.sha }}"
          date -u '+utc_now=%Y-%m-%dT%H:%M:%SZ'
          date '+local_now=%Y-%m-%dT%H:%M:%S%z (TZ='"$TZ"')'

      - name: Restore Google service account json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          mkdir -p ~/.config/gspread
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > ~/.config/gspread/service_account.json
          test -s ~/.config/gspread/service_account.json

      - name: Run X auto poster (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python x_auto_poster.py --dry
          else
            python x_auto_poster.py
          fi

      - name: Run IG auto poster (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python ig_auto_poster.py --dry
          else
            python ig_auto_poster.py
          fi

      - name: Run X auto poster (schedule)
        if: github.event_name == 'schedule'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python x_auto_poster.py

      - name: Run IG auto poster (schedule)
        if: github.event_name == 'schedule'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python ig_auto_poster.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-auto-poster-logs
          path: logs/
          if-no-files-found: ignore
