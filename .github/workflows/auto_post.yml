name: SNS Auto Poster

on:
  schedule:
    - cron: '0 0 * * *'   # JST 09:00 (fallback sweep)
    - cron: '0 11 * * *'  # JST 20:00
    - cron: '0 12 * * *'  # JST 21:00
    - cron: '0 13 * * *'  # JST 22:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no posting / no sheet update)'
        required: true
        default: true
        type: boolean
      platform:
        description: 'Target platform'
        required: true
        default: all
        type: choice
        options:
          - all
          - x
          - ig

env:
  TZ: Asia/Tokyo

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore Google service account json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          mkdir -p ~/.config/gspread
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > ~/.config/gspread/service_account.json
          test -s ~/.config/gspread/service_account.json

      - name: Run auto poster (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python sns_auto_poster.py --platform "${{ inputs.platform }}" $DRY

      - name: Run auto poster (schedule)
        if: github.event_name == 'schedule'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          python sns_auto_poster.py --platform all

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-auto-poster-logs
          path: logs/
          if-no-files-found: ignore
